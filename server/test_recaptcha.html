<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>reCAPTCHA v3 Test — Payboom</title>
</head>
<body>
  <h1>reCAPTCHA v3 Test</h1>
  <form id="testForm">
    <label>Nombre<br><input id="nombre" name="Nombre" value="Andres López"></label><br>
    <label>Correo<br><input id="correo" name="Correo" value="marketing@payboom.io"></label><br>
    <label>Teléfono<br><input id="telefono" name="Telefono" value="12345"></label><br>
    <label>Mensaje<br><textarea id="mensaje" name="Mensaje">Prueba de reCAPTCHA v3</textarea></label><br>
    <button type="submit">Enviar (genera token & post)</button>
  </form>

  <pre id="out" style="white-space:pre-wrap;background:#111;color:#bfb;padding:12px;border-radius:6px;margin-top:12px"></pre>

  <script>
    const SITE_KEY = '6LeMPdksAAAAAOae8l_wKkJ3v6SUVlsPwgVUNCxn';
    const out = document.getElementById('out');
    const form = document.getElementById('testForm');

    function ensureReCaptcha() {
      return new Promise((resolve) => {
        if (window.grecaptcha && typeof grecaptcha.execute === 'function') return resolve(true);
        const existing = document.querySelector('script[data-recaptcha-test]');
        if (existing) {
          const start = Date.now();
          (function poll() {
            if (window.grecaptcha && typeof grecaptcha.execute === 'function') return resolve(true);
            if (Date.now() - start > 8000) return resolve(false);
            setTimeout(poll, 100);
          })();
          return;
        }

        const s = document.createElement('script');
        s.src = 'https://www.google.com/recaptcha/api.js?render=' + SITE_KEY;
        s.async = true; s.defer = true; s.setAttribute('data-recaptcha-test', '1');
        s.onload = () => {
          const start = Date.now();
          (function poll() {
            if (window.grecaptcha && typeof grecaptcha.execute === 'function') return resolve(true);
            if (Date.now() - start > 8000) return resolve(false);
            setTimeout(poll, 100);
          })();
        };
        s.onerror = () => resolve(false);
        document.head.appendChild(s);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      out.textContent = 'Loading reCAPTCHA...';
      const ok = await ensureReCaptcha();
      if (!ok) { out.textContent = 'Could not load reCAPTCHA library. Check console/network.'; return; }
      out.textContent = 'Requesting token from grecaptcha...';
      try {
        const token = await grecaptcha.execute(SITE_KEY, { action: 'contact_form' });
        out.textContent = 'Token received. Sending to /lead.php...\n\n' + token + '\n\n';

        const payload = {
          Nombre: document.getElementById('nombre').value,
          Correo: document.getElementById('correo').value,
          Telefono: document.getElementById('telefono').value,
          Mensaje: document.getElementById('mensaje').value,
          'g-recaptcha-response': token
        };

        const res = await fetch('/server/lead.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(payload)
        });
        const j = await res.json().catch(() => null);
        out.textContent += 'Response status: ' + res.status + '\n' + JSON.stringify(j, null, 2);
      } catch (err) {
        out.textContent = 'Error: ' + err;
      }
    });
  </script>
</body>
</html>
